[project]
name = "diplomacy"
version = "3.0.0"
license = "AGPL-3.0-or-later"
description = "Diplomacy board game server (Python implementation)"
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["BLE001"]  # blind `except Exception` (Track BF)

[tool.ruff.lint.per-file-ignores]
# Out of scope, kept for back-compat (permanent):
"src/server/api/routes/tournaments.py" = ["BLE001"]
# Track BF (docs/specs/fix_plan.md): each step removes its files from this list.
