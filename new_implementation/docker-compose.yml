# The whole Diplomacy stack, on one host (the UpCloud VPS in production).
#
#   diplomacy_web  (public :80)  ─┐
#   diplomacy_bot  (Telegram)    ─┼─► diplomacy_api (:8000, internal) ─► postgres
#
# Only nginx is published to the world. The API is reachable from the other
# containers by its service name and from the host on loopback (for the
# upgrade script and debugging) -- never on a public interface. Postgres is
# not published at all.
#
# Usage:  docker compose up -d        (upgrade.sh does build + up + checks)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=diplomacy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (ensure_env.sh generates one)}
      - POSTGRES_DB=diplomacy_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplomacy -d diplomacy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  diplomacy_api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql+psycopg2://diplomacy:${POSTGRES_PASSWORD}@postgres:5432/diplomacy_db
      - DIPLOMACY_ENVIRONMENT=production
      - DIPLOMACY_JWT_SECRET=${DIPLOMACY_JWT_SECRET:?set DIPLOMACY_JWT_SECRET in .env}
      - DIPLOMACY_ADMIN_TOKEN=${DIPLOMACY_ADMIN_TOKEN:?set DIPLOMACY_ADMIN_TOKEN in .env}
      # The same value the bot sends as X-Bot-Secret; both read it from this .env.
      - DIPLOMACY_BOT_SECRET=${DIPLOMACY_BOT_SECRET:?set DIPLOMACY_BOT_SECRET in .env}
      # Base of password-reset links, e.g. http://<public address>.
      - DIPLOMACY_PASSWORD_RESET_BASE_URL=${DIPLOMACY_PASSWORD_RESET_BASE_URL:-}
      # The web frontend proxies same-origin through nginx, so CORS is not
      # needed for it; keep this tight anyway.
      - DIPLOMACY_CORS_ORIGINS=${DIPLOMACY_CORS_ORIGINS:-http://localhost:5173}
      - DIPLOMACY_LOG_LEVEL=${DIPLOMACY_LOG_LEVEL:-INFO}
      - DIPLOMACY_SMTP_HOST=${DIPLOMACY_SMTP_HOST:-}
      - DIPLOMACY_SMTP_PORT=${DIPLOMACY_SMTP_PORT:-587}
      - DIPLOMACY_SMTP_USE_TLS=${DIPLOMACY_SMTP_USE_TLS:-1}
      - DIPLOMACY_SMTP_USER=${DIPLOMACY_SMTP_USER:-}
      - DIPLOMACY_SMTP_PASSWORD=${DIPLOMACY_SMTP_PASSWORD:-}
      - DIPLOMACY_SMTP_FROM=${DIPLOMACY_SMTP_FROM:-}
      # Trust X-Forwarded-For from any peer. Safe only because nothing but
      # nginx, the bot and the host's loopback can reach this port; it makes
      # the per-IP login/register rate limits key on the real client rather
      # than on nginx's container address (which would pool every user).
      - FORWARDED_ALLOW_IPS=*
    ports:
      # Loopback only. NEVER a bare "8000:8000", which binds every interface.
      - 127.0.0.1:8000:8000
      # DAIDE (AI bots over TCP). Loopback unless DAIDE_BIND says otherwise.
      - ${DAIDE_BIND:-127.0.0.1}:8432:8432
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  diplomacy_bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      - DIPLOMACY_BOT_SECRET=${DIPLOMACY_BOT_SECRET:?set DIPLOMACY_BOT_SECRET in .env}
      # Fixed, not read from .env: a leftover DIPLOMACY_API_URL from the old
      # two-host layout (http://10.8.0.2:8000) must not win.
      - DIPLOMACY_API_URL=http://diplomacy_api:8000
      - DIPLOMACY_BOT_DATA_DIR=/data
      - DIPLOMACY_NOTIFY_POLL_SECONDS=${DIPLOMACY_NOTIFY_POLL_SECONDS:-3}
      - DIPLOMACY_OUTBOX_POLL_SECONDS=${DIPLOMACY_OUTBOX_POLL_SECONDS:-5}
      - PYTHONUNBUFFERED=1
    volumes:
      # The durable outbox: orders and messages waiting for the API (during a
      # restart or deploy), and the per-user games cache.
      - bot_data:/data
    depends_on:
      - diplomacy_api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  diplomacy_web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # Fixed for the same reason as the bot's DIPLOMACY_API_URL.
      - DIPLOMACY_API_UPSTREAM=diplomacy_api:8000
    ports:
      # Plain HTTP. With DOMAIN set, Caddy (below) is the public entry and
      # ensure_env.sh moves this to 127.0.0.1:8080; without it, WEB_BIND keeps
      # the site on loopback until HTTPS is in front (docs/DEPLOYMENT.md).
      - ${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80
    depends_on:
      - diplomacy_api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  caddy:
    # HTTPS for the site: only started when DOMAIN is set in .env, because
    # ensure_env.sh then sets COMPOSE_PROFILES=tls. Caddy gets and renews the
    # certificate itself and redirects http:// to https:// (docker/Caddyfile).
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      - DOMAIN=${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account: keep them, or every restart asks
      # Let's Encrypt again and soon hits its rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - diplomacy_web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

volumes:
  pg_data:
  bot_data:
  caddy_data:
  caddy_config:
