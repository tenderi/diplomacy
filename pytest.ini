[pytest]
# Pytest configuration for Diplomacy project
#
# Database Configuration for Integration Tests:
# Some tests require a database connection. To enable these tests, set one of:
# - SQLALCHEMY_DATABASE_URL (e.g., postgresql+psycopg2://user:pass@localhost:5432/dbname)
# - DIPLOMACY_DATABASE_URL
#
# You can set these via:
# 1. Environment variable: export SQLALCHEMY_DATABASE_URL="..."
# 2. .env file: Create a .env file in the project root with SQLALCHEMY_DATABASE_URL=...
#
# Tests will automatically skip if no database URL is configured.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path configuration
pythonpath = . src

# Test discovery patterns
# asyncio_mode = auto: async test functions run without needing an explicit
# @pytest.mark.asyncio. Existing explicit markers stay valid and are harmless.
asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    # Coverage is NOT collected on a plain local run (keeps it fast). CI runs it and
    # enforces two floors (see .github/workflows/test.yml):
    #   overall  : coverage report --fail-under=60
    #   engine   : coverage report --include='src/engine/*' --fail-under=92
    # Reproduce locally: pytest tests/ --cov=src --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require external dependencies)
    slow: Slow tests (may take > 5 seconds)
    database: Tests that require database
    telegram: Tests that require Telegram bot setup
    channels: Tests for Telegram channel integration features
    map: Tests that require map files
    ai: Tests for AI functionality
    datc: DATC conformance cases (Diplomacy Adjudicator Test Cases 6.A-6.J)
    execution_context: Tests for execution context (script vs module execution)
    deployment: Tests for deployment scripts and infrastructure
    infrastructure: Tests for infrastructure configuration (systemd, nginx, etc.)
    performance: Performance benchmark tests

# Minimum version requirements
minversion = 7.0

# Test timeout (in seconds) - requires pytest-timeout plugin
# timeout = 300

# Warnings are VISIBLE on purpose. `--disable-warnings` used to hide them wholesale, and
# these blanket ignores did the same job more quietly -- between them they concealed every
# `datetime.utcnow()` deprecation in the DAL, which was the same naive-datetime class of
# bug that silently shifted `games.deadline` (fixed in v2.7.23).
#
# With those sources fixed, the suite emits essentially no warnings, so there is nothing
# left to filter. Add a *targeted* entry here if a dependency starts emitting noise you
# genuinely cannot fix -- never a bare `ignore::DeprecationWarning`, and never
# `--disable-warnings`.
filterwarnings =
