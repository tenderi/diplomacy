name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Force Node 24 runtime on JS actions whose latest tag is still Node 20
# (currently actions/upload-artifact). The forced default lands 2026-06-02;
# this opts in early so the deprecation banner doesn't fire and any
# incompatibility surfaces here, not on the day GitHub flips the switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Which jobs this change needs. A docs-only change (Markdown, docs/) skips test, frontend
  # and security; `docs` runs only when the docs site's inputs changed.
  # The skip is a job-level `if:`, not `paths-ignore`: a job skipped by its `if:` reports
  # success to branch protection, while a workflow that never starts leaves the required
  # checks pending forever. The Deploy workflow still follows a green run on main, so the
  # docs site picks the change up.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # An unknown base (a new branch's all-zero `before`, a force-push) yields an empty
          # list, which the script treats as code.
          files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)
          printf 'Changed files:\n%s\n' "${files:-(unknown)}"
          .github/scripts/ci-changes.sh <<<"$files" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: diplomacy_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: diplomacy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries (Cairo for cairosvg)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev
        working-directory: .

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: unpinned ruff broke CI when a new release added default rules
          # (2026-07-23). Keep in sync with the version used locally.
          pip install ruff==0.15.12

      - name: Lint with ruff
        run: ruff check src/ --output-format=github

      - name: Run database migrations
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
        run: alembic upgrade head

      - name: Run test suite (with coverage)
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
          PYTHONPATH: src
        run: pytest tests/ -q --cov=src --cov-report=term-missing

      # Coverage gates. The engine is the rules core and env-independent, so it holds a
      # tight floor; the overall floor is lower because the Telegram bot modules are thin
      # clients that are intentionally lightly unit-tested.
      #
      # Measured 2026-07-28 (v2.7.23 + PR6): engine 92.86%, overall 62.02%.
      #
      # The engine floor stays at 92 rather than ratcheting to ~92.8: Track B's V2 deleted
      # 366 well-tested lines from src/engine/, moving the measured figure 92.97 -> 92.86
      # without losing a test. Only 0.86 points of headroom remain, and a tighter floor
      # would make routine dead-code deletion fail CI. Raise it only with new engine tests.
      # Keep this in sync with .coveragerc, which documents the same reasoning.
      - name: Coverage gate — engine (rules core)
        env:
          PYTHONPATH: src
        run: coverage report --include='src/engine/*' --fail-under=95

      - name: Coverage gate — overall
        env:
          PYTHONPATH: src
        run: coverage report --fail-under=80

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run pip-audit dependency check
        run: pip-audit -r requirements.txt --progress-spinner=off

      - name: Run bandit security check
        run: bandit -r src/ -ll -f json -o bandit-report.json

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # The docs site's strict build (docker/docs.Dockerfile), so a broken link fails the PR
  # rather than the deploy after the merge. Same pins as the Dockerfile; a test checks.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"

      - name: Build the docs site (strict)
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
