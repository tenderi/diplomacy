name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Force Node 24 runtime on JS actions whose latest tag is still Node 20
# (currently actions/upload-artifact). The forced default lands 2026-06-02;
# this opts in early so the deprecation banner doesn't fire and any
# incompatibility surfaces here, not on the day GitHub flips the switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Which jobs this change needs. A docs-only change (Markdown, docs/) skips test, frontend
  # and security; `docs` runs only when the docs site's inputs changed.
  # The skip is a job-level `if:`, not `paths-ignore`: a job skipped by its `if:` reports
  # success to branch protection, while a workflow that never starts leaves the required
  # checks pending forever. The Deploy workflow still follows a green run on main, so the
  # docs site picks the change up.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # An unknown base (a new branch's all-zero `before`, a force-push) yields an empty
          # list, which the script treats as code.
          files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)
          printf 'Changed files:\n%s\n' "${files:-(unknown)}"
          .github/scripts/ci-changes.sh <<<"$files" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: diplomacy_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: diplomacy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries (Cairo for cairosvg)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev
        working-directory: .

      # Hash-locked, ruff included (requirements.in pins it: an unpinned ruff broke CI
      # when a new release added default rules, 2026-07-23).
      - name: Install Python dependencies
        run: pip install --no-deps --require-hashes -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ --output-format=github

      - name: Run database migrations
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
        run: alembic upgrade head

      - name: Run test suite (with coverage)
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
          PYTHONPATH: src
        run: pytest tests/ -q --cov=src --cov-report=term-missing

      # Coverage gates. The engine is the rules core and env-independent, so it holds the
      # tight floor (95%); the overall floor (80%) is lower because the Telegram bot modules
      # are thin clients that are intentionally lightly unit-tested. Each sits two to three
      # points under the measured number: room to delete covered dead code, not to stop
      # testing. Raise a floor only with new tests.
      - name: Coverage gate — engine (rules core)
        env:
          PYTHONPATH: src
        run: coverage report --include='src/engine/*' --fail-under=95

      - name: Coverage gate — overall
        env:
          PYTHONPATH: src
        run: coverage report --fail-under=80

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No dependency runs code at install time; vite and esbuild need no install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # What ships in the bundle: runtime dependencies, high and critical. Dev tooling's
      # advisories (some, like picomatch's, have no fixed release) come as Dependabot alerts.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx --no-install tsc -b --noEmit

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install security tools
        run: pip install --no-deps --require-hashes -r requirements.txt

      # Every lock: the dev environment and what each image installs.
      - name: Run pip-audit dependency check
        run: |
          for lock in requirements.txt requirements-api.txt requirements-bot.txt docker/docs-requirements.txt; do
            echo "== $lock"
            pip-audit --require-hashes --disable-pip -r "$lock" --progress-spinner=off
          done

      - name: Run bandit security check
        run: bandit -r src/ -ll -f json -o bandit-report.json

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # The docs site's strict build (docker/docs.Dockerfile), so a broken link fails the PR
  # rather than the deploy after the merge. Same lock as the Dockerfile; a test checks.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: pip install --no-deps --require-hashes -r docker/docs-requirements.txt

      - name: Build the docs site (strict)
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
