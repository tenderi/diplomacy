name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: new_implementation

# Force Node 24 runtime on JS actions whose latest tag is still Node 20
# (currently actions/upload-artifact). The forced default lands 2026-06-02;
# this opts in early so the deprecation banner doesn't fire and any
# incompatibility surfaces here, not on the day GitHub flips the switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: diplomacy_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: diplomacy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: new_implementation/requirements.txt

      - name: Install system libraries (Cairo for cairosvg)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev
        working-directory: .

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: unpinned ruff broke CI when a new release added default rules
          # (2026-07-23). Keep in sync with the version used locally.
          pip install ruff==0.15.12

      - name: Lint with ruff
        run: ruff check src/ --output-format=github

      - name: Run database migrations
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
        run: alembic upgrade head

      - name: Run test suite (with coverage)
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://diplomacy_user:password@localhost:5432/diplomacy_db
          PYTHONPATH: src
        run: pytest tests/ -q --cov=src --cov-report=term-missing

      # Coverage gates. The engine is the rules core and env-independent, so it holds a
      # tight floor; the overall floor is lower because the Telegram/Discord bot modules
      # are thin clients that are intentionally lightly unit-tested. Measured 2026-07-27:
      # engine 92.91%, overall 58.66% (see docs/specs/fix_plan.md M7 step 2).
      - name: Coverage gate — engine (rules core)
        env:
          PYTHONPATH: src
        run: coverage report --include='src/engine/*' --fail-under=92

      - name: Coverage gate — overall
        env:
          PYTHONPATH: src
        run: coverage report --fail-under=57

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new_implementation/frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new_implementation/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run safety check (informational)
        run: safety check -r requirements.txt
        continue-on-error: true

      - name: Run bandit security check (informational)
        run: bandit -r src/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: new_implementation/bandit-report.json
          if-no-files-found: ignore
