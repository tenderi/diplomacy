name: Deploy

# Deploys the whole stack (docker-compose.yml: Postgres, API, Telegram bot, web
# frontend, docs) to the VPS over SSH after the Test Suite is green on main.
#
# The images are built here, not on the VPS (1 vCPU, 1.8 GiB: a build there was
# the biggest CPU and memory spike the host saw). The `images` job builds the
# four images of the deployed SHA and pushes them to GHCR as
# ghcr.io/tenderi/diplomacy-<service>:<full sha>; the `deploy` job then asks
# the host's deploy hook (host/deploy_hook.sh, the deploy key's forced command)
# to deploy that SHA: it runs upgrade.sh with DIPLOMACY_IMAGE_TAG=<sha>, which pulls them
# anonymously (the packages must be public) and builds on the host only if
# the pull fails. Rollback: run this workflow by hand with the previous SHA;
# its images already exist, so `images` does not rebuild them.
#
# The only secret GitHub holds for the host is TELEGRAM_BOT_TOKEN, written into
# the host's .env on every run. Every other secret (Postgres password, JWT
# secret, admin token, bot secret) is generated ON the host by ensure_env.sh
# the first time and never leaves it; the bot and the API read the bot secret
# from that same file, so there is nothing to keep in sync.
#
# Gated on the DEPLOY_CONTROL_ENABLED repository variable (the name predates
# the single-host layout, when only the "control layer" ran on the VPS) so that
# without the SSH secrets every merge does not produce an expected-red workflow
# (the lesson of the AWS deploy workflow, H2). To enable on a fresh setup:
#
#   gh secret set VPS_SSH_KEY  -R tenderi/diplomacy < ~/.ssh/diplomacy_deploy      # private key of a deploy key
#   gh secret set VPS_HOST     -R tenderi/diplomacy --body "$HOST"             # the VPS address
#   gh secret set VPS_HOST_KEY -R tenderi/diplomacy --body "$(ssh-keyscan -t ed25519 $HOST 2>/dev/null)"
#   gh variable set DEPLOY_CONTROL_ENABLED --body true -R tenderi/diplomacy
#
# VPS_HOST is a secret so the address is masked in the public logs.
# Optional variable (default in "Resolve target"): VPS_USER.
# The deploy key's public half goes into ~/.ssh/authorized_keys of VPS_USER on the
# VPS, where `sudo ./install.sh` (harden_host.sh) gives it its forced command.
# TELEGRAM_BOT_TOKEN is already a repository secret.

on:
  workflow_run:
    workflows: ["Test Suite"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (commit SHA, short or full, or tag). Defaults to current main."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A Test Suite run on an older main commit can finish after the one on a
  # newer commit (two merges minutes apart). Its Deploy would then roll the
  # host back to the older SHA: on 2026-11-16 the run for f4d8cf06 (v3.0.319)
  # finished after a80a7e2f's (v3.0.321) and production stayed on the older one.
  # A workflow_run deploy goes ahead only while its SHA is still main's tip; a
  # newer tip has its own Test Suite run and its own Deploy. A dispatched
  # deploy (a rollback) is never skipped.
  gate:
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_CONTROL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Is this still main's tip?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $SHA: main has moved on to $tip, whose own Test Suite run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.current == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, bot, web, docs]
    outputs:
      # Every matrix leg writes the same value.
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history and tags: a dispatched short SHA is resolved below, and
          # checkout's own `ref:` only takes a full SHA, a branch or a tag.
          fetch-depth: 0

      - name: Resolve the full SHA
        id: target
        # The commit the Test Suite passed on, or the dispatched SHA/tag
        # (github.sha: the dispatched ref's commit, never a branch name). It
        # becomes the full SHA: the image tag and the commit the host checks out
        # must name the same thing.
        env:
          REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          sha=$(git rev-parse --verify --end-of-options "$REF^{commit}")
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/tenderi/diplomacy-${{ matrix.service }}:$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Already pushed?
        id: exists
        # A redeploy or a rollback finds its images already in GHCR and does not
        # rebuild them, so a rollback ships the very image that ran before.
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists; not rebuilding."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.target.outputs.image }}
          # The source label links the GHCR package to the public repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve target
        id: target
        run: |
          sha="${{ needs.images.outputs.sha }}"
          [ -n "$sha" ] || { echo "::error::The images job reported no SHA"; exit 1; }
          {
            echo "sha=$sha"
            echo "user=${{ vars.VPS_USER || 'root' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Will deploy $sha to the VPS as ${{ vars.VPS_USER || 'root' }}"

      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          missing=""
          for name in VPS_HOST VPS_SSH_KEY VPS_HOST_KEY TELEGRAM_BOT_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing -- see the header of this workflow"
            exit 1
          fi

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key from a secret, not ssh-keyscan at deploy time: a
          # scan would trust whatever answers on the address that day.
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
          TARGET: ${{ steps.target.outputs.user }}@${{ secrets.VPS_HOST }}
        run: |
          # The deploy key has a forced command on the host (harden_host.sh): it
          # runs the root-owned host/deploy_hook.sh in /usr/local/lib/diplomacy
          # and nothing else, whatever is asked. The hook takes "deploy <sha>" and
          # the token on stdin (never on a command line, where `ps` would show it).
          # It deploys only commits on main, refuses a change to docker-compose.yml
          # or docker/Caddyfile the maintainer has not approved on the host, writes
          # the token into .env and runs the toolkit's upgrade.sh with
          # DIPLOMACY_IMAGE_TAG=<sha>: pull this commit's images, restart
          # (migrations run in the API entrypoint), fail unless the API and the
          # site answer.
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$TARGET" "deploy $SHA"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
