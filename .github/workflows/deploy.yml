name: Deploy

# Deploys the whole stack (docker-compose.yml: Postgres, API, Telegram bot, web
# frontend, docs) to the VPS over SSH after the Test Suite is green on main.
#
# The images are built here, not on the VPS (1 vCPU, 1.8 GiB: a build there was
# the biggest CPU and memory spike the host saw). The `images` job builds the
# four images of the deployed SHA and pushes them to GHCR as
# ghcr.io/tenderi/diplomacy-<service>:<full sha>; the `deploy` job then runs
# upgrade.sh on the host with DIPLOMACY_IMAGE_TAG=<sha>, which pulls them
# anonymously (the packages must be public) and builds on the host only if
# the pull fails. Rollback: run this workflow by hand with the previous SHA;
# its images already exist, so `images` does not rebuild them.
#
# The only secret GitHub holds for the host is TELEGRAM_BOT_TOKEN, written into
# the host's .env on every run. Every other secret (Postgres password, JWT
# secret, admin token, bot secret) is generated ON the host by ensure_env.sh
# the first time and never leaves it; the bot and the API read the bot secret
# from that same file, so there is nothing to keep in sync.
#
# Gated on the DEPLOY_CONTROL_ENABLED repository variable (the name predates
# the single-host layout, when only the "control layer" ran on the VPS) so that
# without the SSH secrets every merge does not produce an expected-red workflow
# (the lesson of the AWS deploy workflow, H2). To enable on a fresh setup:
#
#   gh secret set VPS_SSH_KEY  -R tenderi/diplomacy < ~/.ssh/diplomacy_deploy      # private key of a deploy key
#   gh secret set VPS_HOST_KEY -R tenderi/diplomacy --body "$(ssh-keyscan -t ed25519 87.58.144.64 2>/dev/null)"
#   gh variable set DEPLOY_CONTROL_ENABLED --body true -R tenderi/diplomacy
#
# Optional variables (defaults in "Resolve target"): VPS_HOST, VPS_USER, VPS_REPO_DIR.
# The deploy key's public half goes into ~/.ssh/authorized_keys of VPS_USER on the VPS.
# TELEGRAM_BOT_TOKEN is already a repository secret.

on:
  workflow_run:
    workflows: ["Test Suite"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (commit SHA or tag). Defaults to current main."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_CONTROL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, bot, web, docs]
    outputs:
      # Every matrix leg writes the same value.
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The commit the Test Suite passed on, or the dispatched SHA/tag
          # (github.sha: the dispatched ref's commit, never a branch name).
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the full SHA
        id: target
        # A dispatched short SHA or tag becomes the full SHA: the image tag and
        # the commit the host checks out must name the same thing.
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/tenderi/diplomacy-${{ matrix.service }}:$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Already pushed?
        id: exists
        # A redeploy or a rollback finds its images already in GHCR and does not
        # rebuild them, so a rollback ships the very image that ran before.
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists; not rebuilding."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.target.outputs.image }}
          # The source label links the GHCR package to the public repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve target
        id: target
        run: |
          sha="${{ needs.images.outputs.sha }}"
          [ -n "$sha" ] || { echo "::error::The images job reported no SHA"; exit 1; }
          {
            echo "sha=$sha"
            echo "host=${{ vars.VPS_HOST || '87.58.144.64' }}"
            echo "user=${{ vars.VPS_USER || 'root' }}"
            echo "repo_dir=${{ vars.VPS_REPO_DIR || '~/diplomacy' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Will deploy $sha to ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '87.58.144.64' }}"

      - name: Check required secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          missing=""
          for name in VPS_SSH_KEY VPS_HOST_KEY TELEGRAM_BOT_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing -- see the header of this workflow"
            exit 1
          fi

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key from a secret, not ssh-keyscan at deploy time: a
          # scan would trust whatever answers on the address that day.
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
          REPO_DIR: ${{ steps.target.outputs.repo_dir }}
          TARGET: ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }}
        run: |
          # The token travels on stdin, never in the remote command line, so it
          # is not visible in `ps` on the VPS. The remote script:
          #   1. checks out the exact SHA the Test Suite passed on;
          #   2. writes TELEGRAM_BOT_TOKEN into .env, leaving every other line
          #      (the host-generated secrets, WEB_BIND, ...) as it is;
          #   3. runs upgrade.sh with DIPLOMACY_IMAGE_TAG=$SHA: fill any missing
          #      secret, pull the images the `images` job pushed (building on
          #      the host only if the pull fails), restart (migrations run in
          #      the API entrypoint), schedule the backup, and fail unless the
          #      API and the site both answer.
          #
          # The token is prepended to the script as a `printf %q` assignment:
          # stdin is the script itself (`bash -s`), so a remote `read` would
          # consume script lines, not a second stream (a heredoc on ssh replaces
          # any `|` into it -- v2.7.84).
          {
            printf 'set -euo pipefail\n'
            printf 'TELEGRAM_BOT_TOKEN=%q\n' "$TELEGRAM_BOT_TOKEN"
            cat <<'REMOTE'
          : "${TELEGRAM_BOT_TOKEN:?}"
          eval "cd $REPO_DIR"
          echo "==> Checking out $SHA"
          # Fetch the target itself: the clone may be single-branch (the VPS one
          # was cloned on vps-split), so a plain `git fetch origin` can miss it.
          git fetch --quiet origin "$SHA"
          git checkout --quiet --detach FETCH_HEAD
          # Until v3.0.1 the app lived in new_implementation/, and so did the
          # host's .env (untracked, so the checkout leaves it there). Move it up
          # *before* anything writes a new one: a fresh .env would get a new
          # POSTGRES_PASSWORD that the existing database doesn't know.
          if [ ! -f .env ] && [ -f new_implementation/.env ]; then
            mv new_implementation/.env .env
            echo "==> Moved .env up from new_implementation/"
          fi
          [ -f .env ] || cp .env.example .env
          chmod 600 .env
          if grep -q "^TELEGRAM_BOT_TOKEN=" .env; then
            awk -v v="$TELEGRAM_BOT_TOKEN" 'BEGIN{FS=OFS="="} $1=="TELEGRAM_BOT_TOKEN"{$0="TELEGRAM_BOT_TOKEN="v} {print}' .env > .env.tmp
            mv .env.tmp .env
          else
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" >> .env
          fi
          chmod 600 .env
          # upgrade.sh skips its `git pull` on a detached HEAD; the checkout
          # above is what pins the deployed SHA.
          DIPLOMACY_IMAGE_TAG="$SHA" ./upgrade.sh
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$TARGET" \
                "SHA='$SHA' REPO_DIR='$REPO_DIR' bash -s"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
